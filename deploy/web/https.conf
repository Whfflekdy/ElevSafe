server {
    listen 443 ssl;
    ssl_certificate /run/secrets/tls_chain;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/elevsafe-proxy.inc;

    auth_basic "ElevSafe";
    auth_basic_user_file /run/secrets/dashboard_users;
    include /etc/nginx/elevsafe-gateway.inc;
}
