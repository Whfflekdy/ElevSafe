map $http_upgrade $elevsafe_control_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # /radar(화면), /ingest(노트북) 둘 다 relay로 넘김
    location ~ ^/(radar|ingest)$ {
        # Ingest credentials are in the query string: do not log WS request URLs.
        access_log off;
        proxy_pass http://relay:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location ~ ^/(control|control-link|control/login|control/logout)$ {
        access_log off;
        proxy_pass http://relay:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $elevsafe_control_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
