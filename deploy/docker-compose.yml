name: elevsafe

# 로그 파일은 최대 10MB × 3개까지만 (디스크 보호)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  relay:
    build: ./relay
    environment:
      INGEST_KEY: ${INGEST_KEY:?deploy/.env에 INGEST_KEY를 넣어 주세요}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/web/Dockerfile
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - relay
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *logging