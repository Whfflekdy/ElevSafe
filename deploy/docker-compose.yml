name: elevsafe

# 로그 파일은 최대 10MB × 3개까지만 (디스크 보호)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  relay:
    build: ./relay
    init: true
    environment:
      INGEST_KEY: ${INGEST_KEY:?deploy/.env에 INGEST_KEY를 넣어 주세요}
      STALE_MS: ${STALE_MS:-3000}
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-65536}
      MAX_BUFFERED_BYTES: ${MAX_BUFFERED_BYTES:-131072}
      HEARTBEAT_MS: ${HEARTBEAT_MS:-30000}
      CONTROL_ENABLED: ${CONTROL_ENABLED:-0}
      CONTROL_HTTP_ORIGIN: ${CONTROL_HTTP_ORIGIN:-http://localhost:18080}
      CONTROL_ALLOW_INSECURE_DEMO: ${CONTROL_ALLOW_INSECURE_DEMO:-0}
      CONTROL_PROXY_TOKEN_FILE: /run/secrets/proxy_token
      CONTROL_BRIDGE_TOKEN: ${CONTROL_BRIDGE_TOKEN:-}
      CONTROL_MAX_BYTES: ${CONTROL_MAX_BYTES:-1024}
      CONTROL_TTL_MS: ${CONTROL_TTL_MS:-2000}
      CONTROL_RATE: ${CONTROL_RATE:-5}
    secrets: [proxy_token]
    networks: [relay_private]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/web/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        umask 077
        token=$$(cat /run/secrets/proxy_token)
        case "$$token" in ''|*[!a-zA-Z0-9_-]*) exit 1;; esac
        test "$${#token}" -ge 32 && test "$${#token}" -le 256 || exit 1
        printf 'set $$elevsafe_proxy "%s";\n' "$$token" > /etc/nginx/elevsafe-proxy.inc
        exec nginx -g 'daemon off;'
    secrets: [proxy_token]
    networks: [default, relay_private]
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-18080}:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/gateway.inc:/etc/nginx/elevsafe-gateway.inc:ro
    depends_on:
      - relay
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

networks:
  relay_private:
    internal: true

secrets:
  proxy_token:
    file: ${PROXY_TOKEN_FILE:?Supply a dedicated proxy token file}
