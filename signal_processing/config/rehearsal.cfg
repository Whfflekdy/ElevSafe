# rehearsal.cfg
# 강의실 리허설용. 바닥에 테이프로 캐빈(1.6 x 1.4m)과 문턱을 표시하고, 같은 기준으로 센서를 설치한다.
# 원점 = 테이프로 표시한 문턱 선의 중앙
# 센서 기울기는 스마트폰 수평계 앱을 센서 윗면에 대서 잼

# ---------- 센서 설치 자세 (현장 실측 후 입력) ----------
# 예: 뒷벽 위치 상단에서 문을 바라보고 25도 숙임
sensor.tx = 0.0
sensor.ty = 1.40        # 문턱에서 센서까지 깊이 [m]
sensor.tz = 2.00        # 바닥에서 센서까지 높이 [m]
sensor.roll_deg  = -25  # 아래로 숙인 각도 (숙이면 음수)
sensor.pitch_deg = 0.0
sensor.yaw_deg   = 180  # 문을 향하면 180

polar.range_res = 0.071565
polar.uv_res    = 0.015938

door.x_min = -0.45
door.x_max =  0.45
door.y_min = -0.50
door.y_max =  0.30
door.z_min =  0.10
door.z_max =  2.10

cabin.x_min = -0.80
cabin.x_max =  0.80
cabin.y_min =  0.30
cabin.y_max =  1.40
cabin.z_min =  0.10
cabin.z_max =  2.20

background.map_path = data/background/rehearsal_map.csv
background.occupancy_threshold = 0.3
background.dilation = 0

dbscan.epsilon = 0.30
dbscan.min_pts = 10
dbscan.z_scale = 0.2