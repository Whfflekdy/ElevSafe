# '#' 이후는 주석, '=' 앞뒤 공백은 무시
# 좌표계: 원점 = 캐빈 문턱 중앙 바닥
#   x = 좌우 (승강장에서 캐빈을 바라볼 때 오른쪽 +), y = 캐빈 안쪽 +, z = 위 +  (오른손 좌표계)
#
# ---------- 센서 설치 자세 ----------
# Retina-4SN 축: 정면 +Y, 오른쪽 +X, 위 +Z (미니테스트 확인)
#   - 아래로 숙여 설치: roll_deg 음수 (예: -25)
#   - 뒷벽에서 문을 향해 설치: yaw_deg = 180
# 1차 엘리베이터 녹화: x<0 쪽 뒤 모서리, 높이 2.14 m, 41° 숙임, 좌우 44° (yaw 기준 확인 필요)
sensor.tx = -0.65
sensor.ty = 1.31
sensor.tz = 2.14
sensor.roll_deg  = -42  # 3차 실측 (2차 -43)
sensor.pitch_deg = 0
sensor.yaw_deg   = 225

# Door Zone
door.x_min = -0.44
door.x_max =  0.44
door.y_min = -0.38    # 문 띠 승강장 쪽 끝(−0.12) + 승강장 약간
door.y_max =  0.42
door.z_min =  0.10
door.z_max =  2.10

# Cabin
cabin.x_min = -0.75
cabin.x_max =  0.75
cabin.y_min =  0.12
cabin.y_max =  1.47
cabin.z_min =  0.10
cabin.z_max =  2.20

# --- HALL (승강장) 구역: 3차 데이터 기준 (11/17) ---
# 센서가 -x 모서리에 있어서 승강장은 주로 +x 쪽만 보임
# y는 띠 가운데 기준. 승강장 테이프는 승강장 문턱 끝 기준으로 붙였으므로 실제 y는 표시보다 0.12m 더 멀다
roi.hall_enable = 1   # 시연(S3-7 승하차)에서 승강장까지 보이도록 켬 (11/24)
hall.x_min = -0.35
hall.x_max = 1.20
hall.y_min = -2.38
hall.y_max = -0.38
hall.z_min = 0.10
hall.z_max = 2.10

# ---------- 센서 격자 (Retina-4SN, 미니테스트 데이터로 측정) ----------
# 점은 거리와 사인 방향(u = x/r, v = z/r)의 격자 위에만 찍힌다 (각도 격자 아님)
polar.range_res = 0.071565
polar.uv_res    = 0.015938

# ---------- 정적 배경 제거 ----------
# 배경 맵은 build_background 로 빈 장면에서 생성 (센서 설치 상태가 바뀌면 다시 생성)
background.map_path = ../data/background/elevator_3rd_bg.csv
# 집 녹화 튜닝(10/9): 30%→20%로 낮추고 dilation 1 적용 시 빈 장면 제거율 66%→87.7%, 정지 사람 손실 0%
# dilation 1은 약 1~2° 흔들림·7cm 이동도 보완. 10%는 리허설 R2-2(벽에 기댄 사람) 확인 후 결정
background.occupancy_threshold = 0.2
background.dilation = 1

# ---------- DBSCAN (front_man 미니테스트 기준 출발값, 두 사람 데이터로 재검증 필요) ----------
# 사람은 위아래로 쪼개지므로 높이 차이에 가중치를 낮춰 계산 (위아래 이웃 거리 = epsilon / z_scale)
dbscan.epsilon = 0.30
dbscan.min_pts = 10
dbscan.z_scale = 0.2

# 문 상태 추정 (문 너머 승강장이 보이면 열림)
door_state.view.x_min = -0.44
door_state.view.x_max =  0.44
door_state.view.y_min = -2.88
door_state.view.y_max = -0.18
door_state.view.z_min =  0.10
door_state.view.z_max =  2.10
door_state.window = 10
door_state.open_threshold  = 10
door_state.close_threshold = 0.5
# 문짝 움직임으로 문 상태 판단 (11/24, 3차 S3-7_t01: 개폐 6/6, 타이머 대비 시작 ±0.7초·닫힘 완료 ±0.3초)
door_state.motion_enable = 1

# 유령 거르기 (11/24, A 의 시연용 40점 필터를 B 로 옮김). 20점 미만, 뒷벽 띠·센서 아래는 60점 미만 제외
# 근거: tools/dbscan_compare.py 4차 S1 6장면 (사람 수 맞음 50→56%, 유령 8.1→6.8%)
ghost_filter.enable = 1
# 닫힌 문 너머(문 CLOSED·UNKNOWN) HALL 덩어리는 유령으로 봄 (3차 S3-7_t01·S4-4_t01, 11/24)
ghost_filter.hall_needs_open = 1
