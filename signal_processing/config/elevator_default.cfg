# '#' 이후는 주석, '=' 앞뒤 공백은 무시
# 좌표계: 원점 = 캐빈 문턱 중앙 바닥
#   x = 좌우 (승강장에서 캐빈을 바라볼 때 오른쪽 +), y = 캐빈 안쪽 +, z = 위 +  (오른손 좌표계)
#
# ---------- 센서 설치 자세 ----------
# Retina-4SN 축: 정면 +Y, 오른쪽 +X, 위 +Z (미니테스트 확인)
#   - 아래로 숙여 설치: roll_deg 음수 (예: -25)
#   - 뒷벽에서 문을 향해 설치: yaw_deg = 180
sensor.tx = 0.0
sensor.ty = 0.0
sensor.tz = 0.0
sensor.roll_deg = 0.0
sensor.pitch_deg = 0.0
sensor.yaw_deg = 0.0

# Door Zone
door.x_min = -0.45
door.x_max =  0.45
door.y_min = -0.50
door.y_max =  0.30
door.z_min =  0.10
door.z_max =  2.10

# Cabin
cabin.x_min = -0.75
cabin.x_max =  0.75
cabin.y_min =  0.30
cabin.y_max =  1.35
cabin.z_min =  0.10
cabin.z_max =  2.20

# ---------- 센서 격자 (Retina-4SN, 미니테스트 데이터로 측정) ----------
# 점은 거리와 사인 방향(u = x/r, v = z/r)의 격자 위에만 찍힌다 (각도 격자 아님)
polar.range_res = 0.071565
polar.uv_res    = 0.015938

# ---------- 정적 배경 제거 ----------
# 배경 맵은 build_background 로 빈 장면에서 생성 (센서 설치 상태가 바뀌면 다시 생성)
background.map_path = data/background/elevator_default_map.csv
# 집 녹화 튜닝(10/9): 30%→20%로 낮추고 dilation 1 적용 시 빈 장면 제거율 66%→87.7%, 정지 사람 손실 0%
# dilation 1은 약 1~2° 흔들림·7cm 이동도 보완. 10%는 리허설 R2-2(벽에 기댄 사람) 확인 후 결정
background.occupancy_threshold = 0.2
background.dilation = 1

# ---------- DBSCAN (front_man 미니테스트 기준 출발값, 두 사람 데이터로 재검증 필요) ----------
# 사람은 위아래로 쪼개지므로 높이 차이에 가중치를 낮춰 계산 (위아래 이웃 거리 = epsilon / z_scale)
dbscan.epsilon = 0.30
dbscan.min_pts = 10
dbscan.z_scale = 0.2