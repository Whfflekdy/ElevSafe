# rehearsal_floor.cfg
# 바닥 높이 확인 전용, 배경 제거 꺼짐
# 강의실 리허설용. 바닥에 테이프로 캐빈(1.6 x 1.4m)과 문턱을 표시하고, 같은 기준으로 센서를 설치한다.
# 원점 = 테이프로 표시한 문턱 선의 중앙
# 센서 기울기는 스마트폰 수평계 앱을 센서 윗면에 대서 잼

# ---------- 센서 설치 자세 (현장 실측 후 입력) ----------
# 예: 뒷벽 위치 상단에서 문을 바라보고 25도 숙임
# 리허설 실측(2026-10-15): 캐빈 뒤쪽 위 x>0 모서리, 원점을 향함, 27도 숙임
sensor.tx = -0.64      # x=0 줄에서 센서 아래 바닥 점까지 (승강장에서 볼때 오른쪽 +)
sensor.ty = 1.31        # 문턱에서 센서까지 깊이 [m]
sensor.tz = 2.10        # 바닥에서 센서까지 높이 [m]

# 이 코드는 축 기준 이름이어서 roll_deg가 숙임. 
sensor.roll_deg  = -38  # 아래로 숙인 각도 (숙이면 음수)
sensor.pitch_deg = 0  # 좌우 기울기 (센서 뒤에서 볼 때 반시계 방향으로 갸웃 -, 시계 방향으로 갸웃 +)
# x > 0 모서리에서 원점을 향해 설치. 180 + atan(−tx/ty) 계산값, R1-1 x ≈ 0으로 확인
sensor.yaw_deg   = 207  # 위에서 내려다 봤을 때 센서가 바라보는 방향(문을 향하면 180)

polar.range_res = 0.071565
polar.uv_res    = 0.015938

door.x_min = -0.45
door.x_max =  0.45
door.y_min = -0.50
door.y_max =  0.30
door.z_min =  -0.50
door.z_max =  2.10

cabin.x_min = -0.80
cabin.x_max =  0.80
cabin.y_min =  0.30
cabin.y_max = 1.20   # 리허설 전용: 녹화 담당이 센서 옆(y 1.2~1.4)에 서 있어 제외. 엘리베이터에서는 뒷벽까지
cabin.z_min = -0.50
cabin.z_max =  2.20

background.map_path = none
background.occupancy_threshold = 0.2
background.dilation = 1

dbscan.epsilon = 0.30
dbscan.min_pts = 10
dbscan.z_scale = 0.2