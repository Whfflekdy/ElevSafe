# minitest.cfg
# 엘리베이터가 아닌 장소(책상 위 센서)에서 녹화한 데이터 테스트용.
# 센서 좌표 그대로 두고, ROI 는 사실상 모든 점을 통과시킨다.

sensor.tx = 0.0
sensor.ty = 0.0
sensor.tz = 0.0
sensor.roll_deg = 0.0
sensor.pitch_deg = 0.0
sensor.yaw_deg = 0.0

polar.range_res = 0.071565
polar.uv_res    = 0.015938

# Door Zone 은 쓰지 않으므로 아무 점도 없는 먼 곳에 작게 둔다
door.x_min = 100.0
door.x_max = 101.0
door.y_min = 100.0
door.y_max = 101.0
door.z_min = 100.0
door.z_max = 101.0

# Cabin 을 넓게 잡아 센서 주변 모든 점을 통과시킨다
cabin.x_min = -20.0
cabin.x_max =  20.0
cabin.y_min = -20.0
cabin.y_max =  20.0
cabin.z_min = -20.0
cabin.z_max =  20.0

background.map_path = data/background/minitest_conn_bg.csv
background.occupancy_threshold = 0.3
background.dilation = 0